[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-redteam"
version = "0.1.0"
description = "AI安全自动化红队测试工具 - 像写单元测试一样测试你的AI安全"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "veriyoung"}]
keywords = ["ai", "security", "red-team", "llm", "safety", "adversarial", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

dependencies = [
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
ai-redteam = "ai_redteam.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_redteam.probes" = ["*.json"]
